<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sentry — incident triage</title>
<!--
  One file, no build step, no framework — matching the project's stdlib-only
  stance, and because this is opened straight from disk.

  The board is organised by what an operator has to DO, not by the status enum.
  Ten statuses collapse into four columns, each answering one question:
  is anything happening, must I decide something, is anything broken that
  nobody is handling, and what happened recently.
-->

<!-- Before the stylesheet, deliberately: setting data-theme after first paint
     shows the wrong palette for a frame. Small enough to stay inline. -->
<script>
  try {
    const t = localStorage.getItem("sentry_theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) { /* localStorage can throw in a sandboxed frame; system default is fine */ }
</script>

<style>
  /* Three blocks, and the order is load-bearing.

     The last two selectors have equal specificity, so the explicit choice must
     come last to win on a light-mode OS, and the :not() guard is what lets an
     explicit light choice win on a dark-mode OS. Defining a colour in only one
     block would leave it undefined in the other two. */
  :root {
    color-scheme: light;
    --bg:#faf9f7; --panel:#fff; --line:#e3dfd7; --ink:#211e1a; --muted:#6f6961;
    --accent:#8a5a2b; --ok:#2f6b4f; --warn:#9a6a1b; --bad:#a33a2a;
    --shadow:0 1px 2px rgba(0,0,0,.05);
    --shadow-panel:-4px 0 20px rgba(0,0,0,.08);
    --scrim:rgba(0,0,0,.25);
    /* Text on a filled --ok/--bad button. White works on the dark light-mode
       fills; on the lighter dark-mode fills it does not, so it flips. */
    --on-solid:#fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:#15140f; --panel:#1e1c18; --line:#332f29; --ink:#ebe7e0; --muted:#9c958b;
      --accent:#d79b62; --ok:#6fbf95; --warn:#d8ab5a; --bad:#e0806e;
      --shadow:0 1px 2px rgba(0,0,0,.3);
      --shadow-panel:-4px 0 26px rgba(0,0,0,.5);
      --scrim:rgba(0,0,0,.5);
      --on-solid:#15140f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#15140f; --panel:#1e1c18; --line:#332f29; --ink:#ebe7e0; --muted:#9c958b;
    --accent:#d79b62; --ok:#6fbf95; --warn:#d8ab5a; --bad:#e0806e;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-panel:-4px 0 26px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.5);
    --on-solid:#15140f;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  button, input { font:inherit; }

  /* ---- header ------------------------------------------------------ */
  header {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  h1 { font-size:15px; margin:0; letter-spacing:.2px; font-weight:650; }
  h1 span { color:var(--muted); font-weight:400; }
  .verdict { font-size:13.5px; color:var(--muted); margin-right:auto; }
  .verdict b { color:var(--ink); }
  .verdict.alert b { color:var(--accent); }
  .chip {
    border:1px solid var(--line); background:var(--bg); color:var(--muted);
    border-radius:999px; padding:4px 11px; font-size:12.5px; cursor:pointer;
  }
  .chip:hover { border-color:var(--accent); }
  .toggle { display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); }
  #setup {
    display:none; gap:8px; width:100%; padding-top:10px; flex-wrap:wrap;
    border-top:1px dashed var(--line); margin-top:2px;
  }
  #setup.open { display:flex; }
  #setup input {
    padding:6px 10px; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); color:var(--ink); flex:1 1 260px;
  }

  /* ---- board ------------------------------------------------------- */
  .board {
    display:grid; grid-template-columns:repeat(4, minmax(0,1fr));
    gap:14px; padding:16px 18px; align-items:start;
  }
  /* Four columns are unusable below this width; stack them in the same
     priority order rather than letting each become a sliver. */
  @media (max-width: 1000px) { .board { grid-template-columns:1fr; } }

  .col { min-width:0; }
  .col > h2 {
    display:flex; align-items:center; gap:7px; margin:0 0 9px;
    font-size:11.5px; font-weight:650; letter-spacing:.7px; text-transform:uppercase;
    color:var(--muted);
  }
  .col > h2 .n {
    background:var(--line); color:var(--ink); border-radius:999px;
    padding:1px 7px; font-size:11px; letter-spacing:0;
  }
  .col-act > h2, .col-act > h2 .n { color:var(--accent); }
  .col-act > h2 .n { background:color-mix(in srgb, var(--accent) 18%, transparent); }
  .col-esc > h2 { color:var(--bad); }

  .card {
    background:var(--panel); border:1px solid var(--line); border-left:2px solid var(--line);
    border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer;
    box-shadow:var(--shadow);
  }
  .card:hover { border-color:var(--accent); }
  .card.sel { border-color:var(--accent); border-left-color:var(--accent); }
  .col-act .card { border-left-color:var(--accent); }
  .col-esc .card { border-left-color:var(--bad); }
  .card .who {
    font-size:12px; color:var(--muted); display:flex; gap:6px;
    align-items:baseline; justify-content:space-between;
  }
  .card .what { margin:3px 0 0; font-size:13.5px; line-height:1.4; }
  .card .act {
    margin-top:6px; font-size:12.5px; color:var(--accent);
    display:flex; justify-content:space-between; gap:8px; align-items:baseline;
  }
  .card .act .conf { color:var(--muted); font-variant-numeric:tabular-nums; }
  .btns { display:flex; gap:6px; margin-top:9px; }
  .btns button {
    flex:1; padding:5px 0; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); cursor:pointer; font-size:12.5px;
  }
  .btns .yes:hover { background:var(--ok); border-color:var(--ok); color:var(--on-solid); }
  .btns .no:hover  { background:var(--bad); border-color:var(--bad); color:var(--on-solid); }
  .btns button:disabled { opacity:.4; cursor:not-allowed; }

  .working { display:inline-block; width:6px; height:6px; border-radius:50%;
             background:var(--warn); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.2} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) { .working { animation:none; opacity:.85 } }
  .card.stuck { border-color:var(--bad); border-left-color:var(--bad); }
  .card.stuck .who { color:var(--bad); }

  .none { color:var(--muted); font-size:12.5px; padding:10px 2px; font-style:italic; }

  /* ---- detail panel ------------------------------------------------ */
  #panel {
    position:fixed; top:0; right:0; bottom:0; width:min(460px, 100%);
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .16s ease-out;
    overflow-y:auto; padding:18px 20px 40px; z-index:20;
    box-shadow:var(--shadow-panel);
  }
  #panel.open { transform:none; }
  @media (prefers-reduced-motion: reduce) { #panel { transition:none } }
  #panel h3 { margin:0 0 2px; font-size:14.5px; }
  #panel .id { font-family:ui-monospace, monospace; font-size:12px; color:var(--muted); }
  #panel .close { position:absolute; top:14px; right:16px; }
  #panel section { margin-top:18px; }
  #panel section > h4 {
    margin:0 0 6px; font-size:11px; letter-spacing:.7px; text-transform:uppercase;
    color:var(--muted); font-weight:650;
  }
  #panel ul { margin:0; padding-left:18px; }
  #panel li { margin-bottom:5px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:13px; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; }
  .trace { display:flex; flex-wrap:wrap; gap:5px; }
  .trace span {
    background:var(--bg); border:1px solid var(--line); border-radius:5px;
    padding:2px 8px; font-size:12px; font-family:ui-monospace, monospace;
  }
  .note {
    font-size:12.5px; color:var(--muted); border-left:2px solid var(--line);
    padding-left:10px; margin-top:8px;
  }
  .note.bad { color:var(--bad); border-color:var(--bad); }
  code { font-family:ui-monospace, monospace; font-size:12px; word-break:break-all; }
  .msg { font-size:12.5px; color:var(--muted); margin-top:8px; }
  .err { color:var(--bad); padding:20px; }
  #scrim {
    position:fixed; inset:0; background:var(--scrim); z-index:19; display:none;
  }
  #scrim.open { display:block; }

  /* ---- how-to-run panel -------------------------------------------- */
  /* Same slide-over mechanics as #panel, sharing #scrim so there is one
     dismissal model. Wider, because it holds prose and code rather than a
     key/value list. */
  #howto {
    position:fixed; top:0; right:0; bottom:0; width:min(560px, 100%);
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .16s ease-out;
    overflow-y:auto; padding:18px 20px 40px; z-index:20;
    box-shadow:var(--shadow-panel);
  }
  #howto.open { transform:none; }
  @media (prefers-reduced-motion: reduce) { #howto { transition:none } }
  #howto h3 { margin:0 0 2px; font-size:14.5px; }
  #howto .close { position:absolute; top:14px; right:16px; }
  #howto section { margin-top:20px; }
  #howto section > h4 {
    margin:0 0 6px; font-size:11px; letter-spacing:.7px; text-transform:uppercase;
    color:var(--muted); font-weight:650;
  }
  #howto p { margin:0 0 8px; font-size:13px; }
  #howto ol, #howto ul { margin:0; padding-left:18px; font-size:13px; }
  #howto li { margin-bottom:6px; }
  #howto code { background:var(--bg); border:1px solid var(--line); border-radius:4px;
                padding:1px 5px; }
  #howto select, #howto input[type=number] {
    padding:6px 9px; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); color:var(--ink); max-width:100%;
  }
  #howto select { width:100%; }

  /* The flow diagram. A list styled as a chain, so it stays readable when
     copied out and needs no SVG. */
  .flow { display:flex; flex-wrap:wrap; gap:4px; align-items:center;
          list-style:none; padding:0; margin:0 0 10px; font-size:12px; }
  .flow li { background:var(--bg); border:1px solid var(--line); border-radius:5px;
             padding:2px 8px; font-family:ui-monospace, monospace; }
  .flow li::after { content:"→"; margin-left:8px; color:var(--muted); }
  .flow li:last-child::after { content:""; margin-left:0; }

  .step { border-left:2px solid var(--line); padding:0 0 2px 12px; margin-bottom:14px; }
  .step > b { font-size:12.5px; display:block; margin-bottom:5px; }
  .step .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .step .hint { font-size:12px; color:var(--muted); margin-top:5px; }
  .step.done { border-left-color:var(--ok); }

  #howto button.go {
    padding:5px 12px; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); cursor:pointer; font-size:12.5px;
  }
  #howto button.go:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  #howto button.go:disabled { opacity:.4; cursor:not-allowed; }
  #howto button.go.danger:hover:not(:disabled) { border-color:var(--bad); color:var(--bad); }

  .out { font-size:12px; color:var(--muted); margin-top:7px; min-height:1em;
         font-variant-numeric:tabular-nums; }
  .out.bad { color:var(--bad); }
  .out.ok  { color:var(--ok); }

  /* Shown in place of the buttons until both target-app values are set. */
  .needs-cfg {
    font-size:12.5px; color:var(--warn); border:1px dashed var(--warn);
    border-radius:6px; padding:8px 10px; margin-bottom:12px;
  }
  .needs-cfg button { margin-top:6px; }

  #howto details { margin-top:8px; }
  #howto summary { cursor:pointer; font-size:12.5px; color:var(--muted); }
  #howto summary:hover { color:var(--accent); }
  #howto pre {
    background:var(--bg); border:1px solid var(--line); border-radius:6px;
    padding:10px; overflow-x:auto; font-size:11.5px; margin:8px 0 0;
    font-family:ui-monospace, monospace; line-height:1.45;
  }
  #howto pre code { background:none; border:0; padding:0; }
</style>

<header>
  <h1>Sentry <span>· incident triage</span></h1>
  <div class="verdict" id="verdict">Not connected</div>
  <label class="toggle"><input type="checkbox" id="auto"> auto-refresh</label>
  <button class="chip" id="guide">How to run</button>
  <button class="chip" id="theme" title="Switch between light, dark and your system setting"></button>
  <button class="chip" id="cfg">connection</button>
  <button class="chip" id="refresh">Refresh</button>
  <div id="setup">
    <input id="url" placeholder="approval gate URL">
    <input id="token" placeholder="approval token" type="password">
    <input id="target" placeholder="target app URL (optional — enables the run panel)">
    <input id="admin" placeholder="admin token" type="password">
  </div>
</header>

<div class="board" id="board"></div>

<div id="scrim"></div>
<aside id="panel" aria-live="polite"></aside>
<aside id="howto" aria-live="polite"></aside>

<script>
const $ = (id) => document.getElementById(id);
const store = sessionStorage;

// ---- theme -----------------------------------------------------------
// localStorage, not the sessionStorage used for everything else. The tokens
// live no longer than the tab because they are shared secrets; a theme
// preference is neither secret nor per-tab, and someone opening a shared link
// should not have to re-pick it every visit.
const THEMES = ["system", "light", "dark"];
const THEME_LABEL = { system: "◑ System", light: "☀ Light", dark: "☾ Dark" };

function currentTheme() {
  try { return document.documentElement.dataset.theme || "system"; }
  catch { return "system"; }
}

function applyTheme(next) {
  if (next === "system") {
    delete document.documentElement.dataset.theme;
    try { localStorage.removeItem("sentry_theme"); } catch {}
  } else {
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("sentry_theme", next); } catch {}
  }
  $("theme").textContent = THEME_LABEL[next];
}

// Ten statuses, four questions. The enum is an implementation detail; what an
// operator wants to know is whether they have to do something.
const COLUMNS = [
  { key:"working",  title:"Working",   statuses:["NEW","INVESTIGATING","APPROVED"],
    empty:"Nothing running." },
  { key:"needs",    title:"Needs you", statuses:["PENDING_APPROVAL"],
    empty:"Nothing awaiting your decision.", cls:"col-act" },
  { key:"escalated",title:"Escalated", statuses:["ESCALATED","FAILED"],
    empty:"Nothing needs investigation.", cls:"col-esc" },
  { key:"handled",  title:"Handled",   statuses:["EXECUTED","CLOSED","REJECTED","INFORMATIONAL"],
    empty:"No history yet.", cap:12 },
];
const IN_FLIGHT = new Set(["NEW","INVESTIGATING","APPROVED"]);

// A crashed investigation stays INVESTIGATING forever — the status guard treats
// it as already in progress, so nothing retries it and nothing moves it. The
// observed mean is ~75s and the agent's own timeout is 300s.
const STUCK_AFTER_S = 360;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const ago = (ts) => {
  if (!ts) return "";
  const s = Math.max(0, Math.floor(Date.now()/1000 - Number(ts)));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s/60) + "m";
  if (s < 86400) return Math.floor(s/3600) + "h";
  return Math.floor(s/86400) + "d";
};

const shortComponent = (i) =>
  (i.affected_component || i.alarm_name || i.incident_id || "")
    .replace(/^sentry-capstone-/, "").replace(/-gulsher$/, "").replace(/-errors$/, "");

let state = { incidents: [], selected: null, timer: null };

// ---- api -------------------------------------------------------------
async function call(path, options = {}) {
  const base = $("url").value.trim().replace(/\/$/, "");
  const token = $("token").value.trim();
  if (!base || !token) throw new Error("Set the gate URL and token.");
  store.setItem("gate_url", base);
  store.setItem("gate_token", token);

  const res = await fetch(base + path, {
    ...options,
    headers: { "content-type":"application/json", "x-approval-token":token,
               "x-actor":"dashboard", ...(options.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}

// ---- target app ------------------------------------------------------
// A second, separate endpoint: the application under observation, not the
// pipeline watching it. Different URL, different token, and unlike the gate it
// is expected to fail — a 502 here means the fault fired, which is the point.
async function callTarget(path, options = {}) {
  const base = $("target").value.trim().replace(/\/$/, "");
  const token = $("admin").value.trim();
  if (!base) throw new Error("Set the target app URL.");
  store.setItem("target_url", base);
  store.setItem("admin_token", token);

  const res = await fetch(base + path, {
    ...options,
    headers: { "content-type":"application/json", "x-admin-token":token,
               ...(options.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, body };
}

// Mirrors MODES in src/target_app/common/_internal.py. Transcribed rather than
// generated because the browser cannot import Python; if a mode is added there,
// add it here. `note` exists for the modes whose observable behaviour surprises
// people — without it they look like nothing happened.
const MODES = [
  { mode:"exception",   fails:"api",      alarm:"api-errors",
    desc:"Unhandled KeyError on a missing field" },
  { mode:"bad_payload", fails:"consumer", alarm:"consumer-errors",
    desc:"API enqueues a message the consumer cannot parse",
    note:"The API returns 201 and looks healthy — the consumer is what breaks. " +
         "Alarm fires on a component that is not the faulty one." },
  { mode:"missing_env", fails:"consumer", alarm:"consumer-errors",
    desc:"Required environment variable absent" },
  { mode:"denied",      fails:"consumer", alarm:"consumer-errors",
    desc:"Genuine IAM AccessDenied reaching S3" },
  { mode:"memory",      fails:"consumer", alarm:"consumer-errors",
    desc:"Unbounded allocation exhausts the 256MB limit",
    note:"The runtime is killed, so there is no application log line at all — " +
         "only Lambda's own REPORT line." },
  { mode:"slow",        fails:"api",      alarm:"api-latency",
    desc:"Slow dependency call breaching latency p95",
    note:"Produces no errors. Trips the latency alarm (Duration > 3000ms), and " +
         "each request blocks for 4.5s, so the traffic burst takes a while." },
  { mode:"silent",      fails:"consumer", alarm:"consumer-errors",
    desc:"Failure with the real cause swallowed",
    note:"Minimal evidence by design. The agent should abstain and escalate " +
         "rather than name a cause." },
  { mode:"timeout",     fails:"consumer", alarm:"consumer-errors",
    desc:"Handler exceeds its configured timeout",
    warn:"Sleeps 300s against a 90s queue visibility timeout, so messages " +
         "redeliver for a while after you disarm." },
  { mode:"retry_storm", fails:"consumer", alarm:"dlq-depth",
    desc:"Handler always raises, so messages retry to the DLQ",
    warn:"Fills the dead-letter queue. Purge it afterwards or the DLQ alarm " +
         "stays lit." },
];

// ---- board -----------------------------------------------------------
function cardHtml(i) {
  const inFlight = IN_FLIGHT.has(i.status);
  const pending = i.status === "PENDING_APPROVAL";
  const elapsed = Math.floor(Date.now()/1000 - Number(i.updated_at || i.triggered_at || 0));
  const stuck = i.status === "INVESTIGATING" && elapsed > STUCK_AFTER_S;

  let what, action = "";

  if (inFlight) {
    what = i.status === "APPROVED" ? "Applying the approved remediation"
         : i.status === "NEW" ? "Queued for investigation"
         : "Investigating";
    if (stuck) what = "Stopped responding mid-investigation";
  } else {
    what = i.summary || i.state_reason || "No analysis recorded.";
    // One line only — the full reasoning lives in the panel, which has room.
    if (what.length > 105) what = what.slice(0, 104) + "…";
  }

  if (pending) {
    const r = { alias_rollback:"Roll back the live alias",
                feature_flag:"Disable a feature flag" }[i.proposed_remediation]
              || i.proposed_remediation;
    action = `<div class="act"><span>${esc(r)}</span>
                <span class="conf">${i.confidence != null ? Number(i.confidence).toFixed(2) : "—"}</span></div>`;
  } else if (i.execution_result) {
    const r = i.execution_result;
    action = `<div class="act"><span>${esc(r.action === "none" ? "No action needed" : r.action)}${
      r.from_version ? ` · v${esc(r.from_version)} → v${esc(r.to_version)}` : ""}</span></div>`;
  } else if (i.status === "INFORMATIONAL") {
    action = `<div class="act"><span>No action needed</span>
                <span class="conf">${i.confidence != null ? Number(i.confidence).toFixed(2) : "—"}</span></div>`;
  } else if (i.status === "REJECTED") {
    action = `<div class="act"><span>Rejected${i.rejected_by ? " by " + esc(i.rejected_by) : ""}</span></div>`;
  } else if (i.status === "FAILED") {
    action = `<div class="act"><span>Could not complete</span></div>`;
  } else if (i.status === "ESCALATED") {
    action = `<div class="act"><span>No safe automated fix</span>
                <span class="conf">${i.confidence != null ? Number(i.confidence).toFixed(2) : "—"}</span></div>`;
  }

  const buttons = pending ? `<div class="btns" data-id="${esc(i.incident_id)}">
      <button class="yes">Approve</button><button class="no">Reject</button>
    </div>` : "";

  return `<article class="card${stuck ? " stuck" : ""}${
      state.selected === i.incident_id ? " sel" : ""}" data-id="${esc(i.incident_id)}">
    <div class="who">
      <span>${inFlight && !stuck ? '<span class="working"></span> ' : ""}${esc(shortComponent(i))}</span>
      <span>${esc(ago(i.updated_at || i.triggered_at))}</span>
    </div>
    <p class="what">${esc(what)}</p>
    ${action}${buttons}
  </article>`;
}

function render() {
  const by = {};
  for (const col of COLUMNS) by[col.key] = [];
  for (const i of state.incidents) {
    const col = COLUMNS.find(c => c.statuses.includes(i.status));
    if (col) by[col.key].push(i);      // unknown statuses are dropped, not hidden silently
  }

  $("board").innerHTML = COLUMNS.map(col => {
    const items = col.cap ? by[col.key].slice(0, col.cap) : by[col.key];
    const hidden = by[col.key].length - items.length;
    return `<div class="col ${col.cls || ""}">
      <h2>${esc(col.title)}<span class="n">${by[col.key].length}</span></h2>
      ${items.length ? items.map(cardHtml).join("")
                     : `<p class="none">${esc(col.empty)}</p>`}
      ${hidden > 0 ? `<p class="none">+ ${hidden} older</p>` : ""}
    </div>`;
  }).join("");

  // The header answers "is anything on fire?" without reading the board.
  const needs = by.needs.length, esc_ = by.escalated.length, work = by.working.length;
  const bits = [];
  if (needs) bits.push(`<b>${needs} need${needs === 1 ? "s" : ""} your decision</b>`);
  if (esc_) bits.push(`${esc_} escalated`);
  if (work) bits.push(`${work} running`);
  $("verdict").innerHTML = bits.length ? bits.join(" · ") : "Nothing outstanding";
  $("verdict").className = "verdict" + (needs ? " alert" : "");
}

async function load(quiet = false) {
  if (!quiet) $("board").innerHTML = `<p class="none">Loading…</p>`;
  try {
    const data = await call("/incidents?status=all");
    state.incidents = data.incidents || [];
    render();
    schedule(state.incidents.some(i => IN_FLIGHT.has(i.status)));
  } catch (err) {
    $("board").innerHTML = `<p class="err">${esc(err.message)}</p>`;
    $("setup").classList.add("open");
    schedule(false);      // do not poll into a bad token forever
  }
}

function schedule(busy) {
  clearTimeout(state.timer);
  if (!$("auto").checked) return;
  // 5s while work is moving, 20s otherwise. An investigation takes ~75s.
  state.timer = setTimeout(() => load(true), busy ? 5000 : 20000);
}

// ---- drawers ---------------------------------------------------------
// Two asides share one scrim, so the scrim is only hidden once neither is open.
// Both are dismissed the same three ways: close chip, scrim, Escape.
function syncScrim() {
  const anyOpen = $("panel").classList.contains("open") ||
                  $("howto").classList.contains("open");
  $("scrim").classList.toggle("open", anyOpen);
}

function closeDrawers() {
  if ($("howto").classList.contains("open")) { closeGuide(); return; }
  if ($("panel").classList.contains("open")) closePanel();
}

// ---- detail panel ----------------------------------------------------
function closePanel() {
  state.selected = null;
  $("panel").classList.remove("open");
  syncScrim();
  render();
}

async function openPanel(id) {
  const i = state.incidents.find(x => x.incident_id === id);
  if (!i) return;
  state.selected = id;
  render();
  $("howto").classList.remove("open");   // one drawer at a time
  $("panel").classList.add("open");
  syncScrim();

  const conf = i.confidence == null ? "—" : Number(i.confidence).toFixed(2);
  // Surfaced deliberately: the evaluation found the agent is occasionally more
  // confident when wrong than when right, so the operator is the check on it.
  const hint = i.confidence == null ? ""
    : Number(i.confidence) < 0.5 ? " — low, treat as a hint"
    : Number(i.confidence) >= 0.85 ? " — high, still check the evidence" : "";

  const rows = [
    ["Status", i.status],
    ["Component", i.affected_component],
    ["Root cause", i.root_cause],
    ["Confidence", conf + hint],
    ["Suspect change", i.suspect_change || "none implicated"],
    ["Runbook", i.runbook_applied || "none matched"],
    ["Cost", i.cost_usd ? "$" + i.cost_usd : null],
  ].filter(([, v]) => v != null && v !== "");

  let outcome = "";
  if (i.execution_result?.undo) {
    outcome = `<section><h4>Executed</h4>
      <div class="note">${esc(i.execution_result.action)}${
        i.execution_result.from_version
          ? ` — v${esc(i.execution_result.from_version)} → v${esc(i.execution_result.to_version)}` : ""}
      <br>Undo: <code>${esc(i.execution_result.undo)}</code></div></section>`;
  }
  for (const [label, value, bad] of [
      ["Escalated", i.escalation_reason, false],
      ["Failed", i.failure_reason, true],
      ["Rejected", i.rejection_reason, false]]) {
    if (value) outcome += `<section><h4>${label}</h4>
      <div class="note${bad ? " bad" : ""}">${esc(value)}</div></section>`;
  }

  $("panel").innerHTML = `
    <button class="chip close" id="x">close</button>
    <h3>${esc(shortComponent(i))}</h3>
    <div class="id">${esc(i.incident_id)}</div>
    <section><h4>Summary</h4>
      <div>${esc(i.summary || i.state_reason || "No analysis recorded.")}</div></section>
    <section><h4>Assessment</h4>
      <dl class="kv">${rows.map(([k, v]) =>
        `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>
    ${(i.evidence || []).length ? `<section><h4>Evidence</h4>
      <ul>${i.evidence.map(e => `<li>${esc(e)}</li>`).join("")}</ul></section>` : ""}
    ${i.remediation_detail ? `<section><h4>Proposed</h4>
      <div class="note">${esc(i.remediation_detail)}</div></section>` : ""}
    ${outcome}
    <section id="trace"><h4>Investigation</h4>
      <p class="none">loading…</p></section>
    ${i.status === "PENDING_APPROVAL" ? `<section>
      <div class="btns" data-id="${esc(i.incident_id)}">
        <button class="yes">Approve</button><button class="no">Reject</button>
      </div><div class="msg"></div></section>` : ""}`;

  $("x").onclick = closePanel;

  // The tool sequence lives on the full record, not the list summary. It is
  // the clearest evidence of how the conclusion was reached, so it is worth a
  // second request.
  try {
    const full = await call("/incidents/" + encodeURIComponent(id));
    const steps = full.trace?.steps || [];
    $("trace").innerHTML = `<h4>Investigation</h4>` + (steps.length
      ? `<div class="trace">${steps.map(s =>
           `<span>${esc(s.tool)}</span>`).join("")}</div>
         <p class="msg">${steps.length} tool calls${
           full.trace?.duration_ms ? " · " + Math.round(full.trace.duration_ms/1000) + "s" : ""}</p>`
      : `<p class="none">No tool calls recorded.</p>`);
  } catch {
    $("trace").innerHTML = `<h4>Investigation</h4><p class="none">Trace unavailable.</p>`;
  }
}

// ---- how to run ------------------------------------------------------
// The only instructions a visitor will ever see. cli-reference.md is
// gitignored (it holds a real token), so it cannot be the answer here.
let run = { armed: null, since: null, timer: null };

const TRAFFIC_DEFAULT = 5;

function targetReady() {
  return Boolean($("target").value.trim() && $("admin").value.trim());
}

function guideHtml() {
  const ready = targetReady();

  const options = MODES.map(m =>
    `<option value="${esc(m.mode)}">${esc(m.mode)} — ${esc(m.desc)}</option>`).join("");

  // Buttons exist either way; when unconfigured they are disabled and the
  // reason is stated, which beats failing at fetch time with a CORS error.
  const gate = ready ? "" : `<div class="needs-cfg">
      The run controls need the <b>target app URL</b> and <b>admin token</b>.
      Add them under <i>connection</i>.
      <br><button class="go" id="g-open-cfg">Open connection settings</button>
    </div>`;

  const dis = ready ? "" : " disabled";

  return `
    <button class="chip close" id="g-x">close</button>
    <h3>How to run this</h3>
    <div class="id">break something on purpose, then watch it get diagnosed</div>

    <section>
      <h4>What happens</h4>
      <ul class="flow">
        <li>alarm</li><li>ingest</li><li>agent</li><li>approval</li><li>executor</li>
      </ul>
      <p>A CloudWatch alarm on the demo app raises an incident. An agent
      investigates it with four read-only tools — logs, metrics, recent changes,
      runbooks — and writes a root-cause analysis. Nothing is applied until a
      human approves it on the board behind this panel.</p>
      <p>The agent holds <b>no write permission</b> on anything it investigates.
      That is enforced by IAM, not by asking the model nicely, so a wrong
      conclusion produces a wrong <i>proposal</i> and never a wrong
      <i>action</i>. Abstaining is a valid answer and is scored as one.</p>
    </section>

    <section>
      <h4>Run it</h4>
      ${gate}

      <div class="step" id="g-step1">
        <b>1 · Choose a failure</b>
        <select id="g-mode">${options}</select>
        <div class="hint" id="g-modehint"></div>
      </div>

      <div class="step" id="g-step2">
        <b>2 · Arm it</b>
        <div class="row">
          <button class="go" id="g-arm"${dis}>Arm</button>
          <button class="go" id="g-flags"${dis}>What's armed?</button>
          <button class="go danger" id="g-disarm"${dis}>Disarm everything</button>
        </div>
        <div class="hint">Arming only writes a flag. Nothing has broken yet —
        the fault fires on the next ordinary request, so the incident looks like
        a real production failure rather than someone hitting a break endpoint.</div>
        <div class="out" id="g-armout"></div>
      </div>

      <div class="step" id="g-step3">
        <b>3 · Send traffic into it</b>
        <div class="row">
          <button class="go" id="g-traffic"${dis}>Send</button>
          <input type="number" id="g-count" value="${TRAFFIC_DEFAULT}" min="1" max="25" style="width:64px">
          <span class="hint" style="margin:0">orders</span>
        </div>
        <div class="out" id="g-trafout"></div>
      </div>

      <div class="step" id="g-step4">
        <b>4 · Wait for the alarm</b>
        <div class="hint">The alarm evaluates over a 60-second period and only
        fires on a state <i>transition</i>, so expect the incident to appear on
        the board in roughly 2–4 minutes. Investigation itself takes about a
        minute.</div>
        <div class="out" id="g-waitout"></div>
      </div>

      <div class="step" id="g-step5">
        <b>5 · Decide</b>
        <div class="hint">The incident lands in <b>Needs you</b> if the agent
        proposes a remediation, or <b>Escalated</b> if it will not commit to
        one. Open the card to read the evidence and the tool calls behind the
        conclusion before approving.</div>
      </div>
    </section>

    <section>
      <h4>If nothing appears</h4>
      <ul>
        <li><b>Alarm actions may be disabled.</b> The evaluation sweep turns
        them off so scenarios are not investigated twice; an end-to-end run
        needs them on. Re-enable with
        <code>aws cloudwatch enable-alarm-actions</code>.</li>
        <li><b>The alarm may already be in ALARM.</b> It only publishes on a
        transition, so a second run while it is still lit raises nothing.</li>
        <li><b>Check what is armed.</b> A leftover mode from an earlier run is
        the usual explanation for odd behaviour.</li>
        <li>A mode self-disarms after its uses are spent, or after 15 minutes.</li>
      </ul>
    </section>

    <section>
      <h4>The same thing from a terminal</h4>
      <details>
        <summary>PowerShell, if you would rather not use the buttons</summary>
        <pre><code id="g-cli">${esc(cliSnippet())}</code></pre>
        <button class="go" id="g-copy" style="margin-top:8px">Copy</button>
      </details>
    </section>`;
}

function cliSnippet() {
  const url = $("target").value.trim().replace(/\/$/, "") || "<target app URL>";
  const mode = $("g-mode")?.value || "exception";
  const n = Number($("g-count")?.value) || TRAFFIC_DEFAULT;
  return [
    `$url   = "${url}"`,
    `$admin = @{ "x-admin-token" = "<admin token>" }`,
    ``,
    `# arm a failure mode`,
    `Invoke-RestMethod -Method Post -Uri "$url/admin/chaos/${mode}" -Headers $admin \``,
    `  -Body '{"remaining":${n + 2},"ttl_seconds":900}' -ContentType application/json`,
    ``,
    `# drive ordinary traffic into it (errors here are the point)`,
    `1..${n} | ForEach-Object {`,
    `  try { Invoke-RestMethod -Method Post -Uri "$url/orders" \``,
    `          -Body '{"item":"widget","quantity":1}' -ContentType application/json }`,
    `  catch { "request failed: $($_.Exception.Response.StatusCode)" }`,
    `  Start-Sleep -Milliseconds 300`,
    `}`,
    ``,
    `# what is armed right now, and how to stop it`,
    `Invoke-RestMethod -Uri "$url/admin/flags" -Headers $admin`,
    `Invoke-RestMethod -Method Delete -Uri "$url/admin/chaos/${mode}" -Headers $admin`,
  ].join("\n");
}

function modeHint() {
  const m = MODES.find(x => x.mode === $("g-mode").value);
  if (!m) return;
  const bits = [`Fails in the <b>${esc(m.fails)}</b>, trips <code>${esc(m.alarm)}</code>.`];
  if (m.note) bits.push(esc(m.note));
  if (m.warn) bits.push(`<b>Leaves state behind:</b> ${esc(m.warn)}`);
  $("g-modehint").innerHTML = bits.join(" ");
  $("g-cli").textContent = cliSnippet();
}

async function armMode() {
  const mode = $("g-mode").value;
  const n = Number($("g-count").value) || TRAFFIC_DEFAULT;
  const out = $("g-armout");
  out.className = "out"; out.textContent = "Arming…";
  try {
    // remaining = traffic + 2, matching the evaluation harness: a couple spare
    // so a retry does not exhaust the mode before the traffic burst finishes.
    const r = await callTarget(`/admin/chaos/${encodeURIComponent(mode)}`, {
      method:"POST", body: JSON.stringify({ remaining: n + 2, ttl_seconds: 900 }),
    });
    if (!r.ok) throw new Error(targetError(r));
    run.armed = mode;
    $("g-step2").classList.add("done");
    out.className = "out ok";
    out.textContent = `Armed ${mode}. Nothing has broken yet — send traffic to trigger it.`;
  } catch (err) {
    out.className = "out bad";
    out.textContent = fetchHint(err);
  }
}

async function driveTraffic() {
  const n = Math.min(25, Math.max(1, Number($("g-count").value) || TRAFFIC_DEFAULT));
  const out = $("g-trafout");
  const btn = $("g-traffic");
  btn.disabled = true;
  out.className = "out";

  let ok = 0, failed = 0;
  for (let k = 0; k < n; k++) {
    out.textContent = `Sending ${k + 1} of ${n}… ${ok} ok, ${failed} failed`;
    try {
      const r = await callTarget("/orders", {
        method:"POST", body: JSON.stringify({ item:"widget", quantity:1 }),
      });
      r.ok ? ok++ : failed++;
    } catch { failed++; }
    if (k < n - 1) await new Promise(r => setTimeout(r, 300));
  }

  btn.disabled = false;
  $("g-step3").classList.add("done");
  const m = MODES.find(x => x.mode === run.armed);

  // A failure count of zero is not necessarily a problem — three of the nine
  // modes break the consumer or the latency metric while the API keeps
  // answering 201. Saying "0 failed" without that context reads as "it did not
  // work", which sends people looking for a bug that is not there.
  let verdict, expected = true;
  if (failed > 0) {
    verdict = `${ok} ok, ${failed} failed — the fault fired.`;
  } else if (m && m.fails === "consumer") {
    verdict = `${ok} ok, 0 failed — expected for ${m.mode}: the API succeeds and ` +
              `the consumer fails behind it, off the request path.`;
  } else if (m && m.mode === "slow") {
    verdict = `${ok} ok, 0 failed — expected for slow: requests succeed, just ` +
              `late enough to breach the latency alarm.`;
  } else {
    verdict = `${ok} ok, 0 failed — nothing broke. Is a mode still armed?`;
    expected = false;
  }
  out.className = "out" + (expected ? " ok" : " bad");
  out.textContent = verdict;

  startWaiting();
}

// Poll the board while the alarm makes up its mind, so the incident appears
// without anyone reaching for Refresh.
function startWaiting() {
  clearInterval(run.timer);
  run.since = Date.now();
  if (!$("auto").checked) {
    $("auto").checked = true;
    store.setItem("gate_auto", "1");
    load(true);
  }
  const tick = () => {
    const s = Math.floor((Date.now() - run.since) / 1000);
    const el = $("g-waitout");
    if (!el) { clearInterval(run.timer); return; }
    el.className = "out";
    el.textContent = s < 240
      ? `Waiting ${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s — ` +
        `auto-refresh is on, the board updates itself.`
      : `${Math.floor(s / 60)}m elapsed with nothing yet. Check that alarm ` +
        `actions are enabled and that the alarm was not already in ALARM.`;
    $("g-step4").classList.toggle("done", state.incidents.some(i =>
      Number(i.triggered_at || 0) * 1000 > run.since - 60000));
  };
  tick();
  run.timer = setInterval(tick, 1000);
}

async function showFlags() {
  const out = $("g-armout");
  out.className = "out"; out.textContent = "Checking…";
  try {
    const r = await callTarget("/admin/flags");
    if (!r.ok) throw new Error(targetError(r));
    // list_flags returns raw rows, including expired and exhausted ones, so
    // report the fields that decide whether a flag will actually fire.
    const live = (r.body.flags || []).filter(f => f.enabled &&
      Number(f.remaining) > 0 && Number(f.expires_at) * 1000 > Date.now());
    out.className = "out" + (live.length ? "" : " ok");
    out.textContent = live.length
      ? "Armed: " + live.map(f =>
          `${f.name} (${f.remaining} uses left)`).join(", ")
      : "Nothing armed.";
  } catch (err) {
    out.className = "out bad";
    out.textContent = fetchHint(err);
  }
}

async function disarmAll() {
  const out = $("g-armout");
  out.className = "out"; out.textContent = "Disarming…";
  let failed = 0;
  for (const m of MODES) {
    try {
      const r = await callTarget(`/admin/chaos/${m.mode}`, { method:"DELETE" });
      if (!r.ok) failed++;
    } catch { failed++; }
  }
  run.armed = null;
  clearInterval(run.timer);
  $("g-step2").classList.remove("done");
  out.className = "out" + (failed ? " bad" : " ok");
  out.textContent = failed
    ? `${MODES.length - failed} of ${MODES.length} cleared; ${failed} failed.`
    : "All modes disarmed.";
}

// A browser reports a blocked cross-origin request as an opaque "Failed to
// fetch", which sends people hunting in the wrong place. Name the two causes
// that actually produce it here.
function fetchHint(err) {
  const msg = String(err && err.message || err);
  if (/failed to fetch|networkerror|load failed/i.test(msg)) {
    return "Could not reach the target app. Either its Function URL has no CORS " +
           "configuration, or the URL is wrong. See infra/target_app.tf.";
  }
  return msg;
}

// The admin routes answer a bad token with a bare "forbidden", which does not
// say which of the two plausible causes it is — and one of them is not about
// the value you typed at all. Reaching this code at least proves CORS and the
// Function URL's resource policy are working.
function targetError(r) {
  if (r.status === 403) {
    return "403 forbidden — either the admin token is wrong, or ADMIN_TOKEN is " +
           "unset on the target Lambda, which rejects every token. Check with: " +
           "aws lambda get-function-configuration --function-name <api> " +
           "--query Environment.Variables";
  }
  return r.body && r.body.error ? `${r.body.error} (HTTP ${r.status})` : "HTTP " + r.status;
}

function closeGuide() {
  clearInterval(run.timer);
  $("howto").classList.remove("open");
  syncScrim();
}

function openGuide() {
  $("panel").classList.remove("open");   // one drawer at a time
  $("howto").innerHTML = guideHtml();
  $("howto").classList.add("open");
  syncScrim();

  $("g-x").onclick = closeGuide;
  $("g-mode").onchange = modeHint;
  $("g-count").onchange = () => { $("g-cli").textContent = cliSnippet(); };
  modeHint();

  if (targetReady()) {
    $("g-arm").onclick = armMode;
    $("g-traffic").onclick = driveTraffic;
    $("g-flags").onclick = showFlags;
    $("g-disarm").onclick = disarmAll;
  } else {
    $("g-open-cfg").onclick = () => {
      $("setup").classList.add("open");
      closeGuide();
      $("target").focus();
    };
  }

  $("g-copy").onclick = async () => {
    const text = $("g-cli").textContent;
    try {
      await navigator.clipboard.writeText(text);
      $("g-copy").textContent = "Copied";
    } catch {
      // clipboard needs a secure context, which file:// is not in every
      // browser. Selecting the text is the honest fallback.
      const r = document.createRange();
      r.selectNodeContents($("g-cli"));
      const sel = getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      $("g-copy").textContent = "Selected — press Ctrl+C";
    }
    setTimeout(() => { $("g-copy").textContent = "Copy"; }, 2000);
  };
}

// ---- actions ---------------------------------------------------------
async function act(box, verb) {
  const id = box.dataset.id;
  let reason = null;
  if (verb === "reject") {
    reason = prompt("Why is this being rejected? (recorded on the incident)");
    if (reason === null) return;
  }
  box.querySelectorAll("button").forEach(b => b.disabled = true);
  const msg = box.parentElement.querySelector(".msg");
  if (msg) msg.textContent = "Working…";

  try {
    await call(`/incidents/${encodeURIComponent(id)}/${verb}`, {
      method:"POST", body: JSON.stringify({ actor:"dashboard", reason }),
    });
    if (msg) msg.textContent = verb === "approve" ? "Approved — executor invoked." : "Rejected.";
    closePanel();
    setTimeout(() => load(true), 1200);   // the executor runs asynchronously
  } catch (err) {
    if (msg) msg.textContent = err.message;
    box.querySelectorAll("button").forEach(b => b.disabled = false);
  }
}

function wire(root) {
  root.addEventListener("click", (e) => {
    const btns = e.target.closest(".btns");
    if (btns) {
      e.stopPropagation();
      if (e.target.classList.contains("yes")) act(btns, "approve");
      if (e.target.classList.contains("no")) act(btns, "reject");
      return;
    }
    const card = e.target.closest(".card");
    if (card) openPanel(card.dataset.id);
  });
}
wire($("board"));
wire($("panel"));

$("scrim").onclick = closeDrawers;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawers(); });
$("refresh").onclick = () => load();
$("cfg").onclick = () => $("setup").classList.toggle("open");
$("guide").onclick = () =>
  $("howto").classList.contains("open") ? closeGuide() : openGuide();
$("theme").onclick = () =>
  applyTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]);
$("auto").onchange = () => {
  store.setItem("gate_auto", $("auto").checked ? "1" : "");
  $("auto").checked ? load(true) : clearTimeout(state.timer);
};

// Rebuild the guide when the target app details change, so its buttons and CLI
// snippet reflect what is configured without a reload.
for (const id of ["target", "admin"]) {
  $(id).onchange = () => { if ($("howto").classList.contains("open")) openGuide(); };
}

// ---- bootstrap -------------------------------------------------------
// config.json is deployed alongside this page and carries the two Function
// URLs, so someone handed a link only has to paste the tokens. It holds no
// secrets. Absent — opening this from disk, say — everything still works,
// there is just nothing to prefill.
async function loadConfig() {
  try {
    const res = await fetch("config.json", { cache: "no-store" });
    return res.ok ? await res.json() : {};
  } catch {
    return {};                     // file:// throws here; not an error worth showing
  }
}

async function init() {
  applyTheme(currentTheme());

  const cfg = await loadConfig();
  // What the visitor typed beats what was deployed.
  const pick = (key, ...fallbacks) =>
    store.getItem(key) || fallbacks.find(Boolean) || "";

  $("url").value    = pick("gate_url", cfg.approval_url);
  $("token").value  = store.getItem("gate_token") || "";
  $("target").value = pick("target_url", cfg.target_api_url);
  $("admin").value  = store.getItem("admin_token") || "";
  $("auto").checked = store.getItem("gate_auto") === "1";

  if ($("url").value && $("token").value) { load(); return; }

  // First visit: the old behaviour was an empty board and one line of text
  // with nothing actionable on it. Open the instructions instead.
  $("setup").classList.add("open");
  $("board").innerHTML =
    `<p class="none">Paste the approval token above to connect.</p>`;
  openGuide();
}

init();
</script>
